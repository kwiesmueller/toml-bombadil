lead = "<p>A dotfile manager written in Rust. Symlinks, variables, packages, and an audit trail — all from <code>dots.toml</code> files.</p>"
url = "/docs/getting-started/quick-start/"
url_button = "Get started"
repo_version = "v4 alpha"
repo_license = "MIT License"
repo_url = "https://github.com/kwiesmueller/toml-bombadil"

[[extra.home.list]]
title = "dots.toml per directory"
content = "Each dotfile subdirectory owns its config: file mappings, packages, hooks, and profile overrides in one place."

[[extra.home.list]]
title = "Package management"
content = "Declare packages with per-manager install commands. bombadil sync installs what's missing and detects drift."

[[extra.home.list]]
title = "Audit trail"
content = "Every file operation is recorded. Inspect diffs, view captured output, and revert individual actions."

[[extra.home.list]]
title = "Multiple strategies"
content = "Full symlink, line-based patch, semantic deep-merge (JSON/YAML/TOML), and inject (append/prepend with markers)."

