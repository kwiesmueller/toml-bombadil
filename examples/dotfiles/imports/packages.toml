# Imported package definitions
# Demonstrates config organization via imports

[settings.packages.demo-cli-tool]
tags = ["essential", "cli"]
[settings.packages.demo-cli-tool.install]
dnf = "demo-cli"
apt = "demo-cli"
brew = "demo-cli"

[settings.packages.demo-editor]
tags = ["essential", "editor"]
[settings.packages.demo-editor.install]
dnf = "demo-editor"
apt = "demo-editor"
brew = "demo-editor"
