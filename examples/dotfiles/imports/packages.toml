[settings.packages.demo-heavy-package]
tags = ["heavy", "optional"]
[settings.packages.demo-heavy-package.install]
dnf = "demo-heavy"
apt = "demo-heavy"

[settings.packages.demo-laptop-tool]
tags = ["laptop"]
[settings.packages.demo-laptop-tool.install]
dnf = "laptop-tool"

[settings.packages.demo-server-tool]
tags = ["server"]
[settings.packages.demo-server-tool.install]
dnf = "server-tool"
