# Full strategy with Tera templating
# Variables are substituted at link time

# From base.toml
editor = "{{ editor }}"
terminal = "{{ terminal }}"
font_size = {{ font_size }}

# From theme.toml
background = "{{ background }}"
foreground = "{{ foreground }}"
accent = "{{ color_primary }}"

# Platform context (auto-detected)
{% if os == "linux" %}
platform_specific = "linux_value"
{% elif os == "macos" %}
platform_specific = "macos_value"
{% endif %}

# Conditional based on variable
{% if enable_debug == "true" %}
debug_mode = true
log_level = "debug"
{% else %}
debug_mode = false
log_level = "info"
{% endif %}

# From local-vars.toml (dot-specific override)
local_setting = "{{ local_override }}"
