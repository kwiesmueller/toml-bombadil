# Full strategy with Tera templating
# Variables are substituted at link time

# From base.toml
editor = "nvim"
terminal = "alacritty"
font_size = 16

# From theme.toml
background = "#1a1b26"
foreground = "#c0caf5"
accent = "#7aa2f7"

# Platform context (auto-detected)
platform_specific = "linux_value"

# Conditional based on variable
debug_mode = false
log_level = "info"

# From local-vars.toml (dot-specific override)
local_setting = "this_is_local"
