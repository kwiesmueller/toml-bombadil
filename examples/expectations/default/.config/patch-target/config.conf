# Base config file for patch strategy demonstration
# This simulates a system default config that we want to patch

[general]
theme = "dark"
language = "en_US"

[keybindings]
quit = "Ctrl+Q"
save = "Ctrl+S"
open = "Ctrl+O"
new = "Ctrl+N"
search = "Ctrl+F"

[appearance]
font_size = 12
background = "#1a1b26"
foreground = "#c0caf5"

[features]
# Feature flags
enable_telemetry = false
auto_update = false
enable_vim_mode = true
show_line_numbers = true
