[package]
name = "toml-bombadil"
version = "4.0.0-alpha.1"
authors = ["Kevin Wiesmueller <kevin.wiesmueller@gmail.com>"]
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://github.com/kwiesmueller/toml-bombadil/"
description = """
A dotfile manager with patching, drift detection, and cross-platform support.
"""

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"

# Error handling & logging (v4 new)
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
colored = "2"
config = "0.14"
lazy_static = "1"

# Schema generation for editor autocomplete
schemars = "0.8"

# CLI
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }

# Template rendering
tera = "1"

# File operations
dirs = "5"
walkdir = "2"
globwalk = "0.9"
tempfile = "3"

# Diff & patching
similar = "2"
json-patch = "3"

# Cryptographic hashing
sha2 = "0.10"
hex = "0.4"

# Utilities
regex = "1"
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }

# File watching
watchexec = "2"
watchexec-filterer-ignore = "1"
ignore-files = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
indexmap = { version = "2.13.0", features = ["serde", "std"] }

[features]
default = ["cli"]
cli = ["clap", "clap_complete"]

[[bin]]
name = "bombadil"
path = "src/bin/bombadil.rs"
required-features = ["clap"]

[dev-dependencies]
speculoos = "0.11.0"
pretty_assertions = "1.3.0"
tempfile = "3.10"
# Used by gpg.rs and hook.rs tests
sealed_test = "1.0.0"
cmd_lib = "1.3.0"
indoc = "2.0.1"
