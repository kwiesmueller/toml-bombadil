name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 4.0.0)'
        required: true

jobs:
  release:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add GPG test key pair
        run: |
          gpg --import tests/gpg/public.gpg
          gpg --import tests/gpg/private.gpg
          echo -e "5\ny\n" | gpg --no-tty --command-fd 0 --expert --edit-key test@toml.bombadil.org trust

      - name: Run tests
        run: cargo test --lib

      - name: Bump version
        run: |
          cargo install cargo-edit --features vendored-openssl
          cargo set-version ${{ github.event.inputs.version }}

      - name: Commit version bump
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v${{ github.event.inputs.version }}"
          git tag "v${{ github.event.inputs.version }}"
          git push origin main --tags

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: cargo publish
